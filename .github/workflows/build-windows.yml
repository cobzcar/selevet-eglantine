# À placer dans .github/workflows/build-windows.yml de TON fork.
# Compile Eglantine pour Windows (MSVC + Ninja) avec l'interface traduite (ENABLE_QT_TRANSLATION=ON).
name: build-windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Le dépôt omet src/audio_core/out/ (ignoré par le .gitignore "out/").
      # On récupère ces 4 fichiers depuis le commit de base de Selevet (zortos293/Eglantine build 31).
      - name: Fetch missing audio_core/out sources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src/audio_core/out | Out-Null
          foreach ($f in 'audio_out.cpp','audio_out.h','audio_out_system.cpp','audio_out_system.h') {
            if (-not (Test-Path "src/audio_core/out/$f")) {
              Invoke-WebRequest -UseBasicParsing "https://raw.githubusercontent.com/zortos293/Eglantine/badc91ebce/src/audio_core/out/$f" -OutFile "src/audio_core/out/$f"
            }
            if ((Get-Item "src/audio_core/out/$f").Length -lt 1000) { throw "Téléchargement invalide: $f" }
          }

      - name: Install Vulkan SDK
        shell: powershell
        run: ./tools/windows/install-vulkan-sdk.ps1

      - name: Load MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Le fork est écrit pour Clang : MSVC transforme certains avertissements en erreurs (/weXXXX).
      # On les convertit en simples désactivations (/wdXXXX).
      - name: Relax MSVC warnings-as-errors
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Path src, externals -Include CMakeLists.txt,*.cmake -ErrorAction SilentlyContinue | ForEach-Object {
            $c = Get-Content -Raw -Encoding UTF8 $_.FullName
            $n = [regex]::Replace($c, '/we(\d{4})', '/wd$1')
            if ($n -ne $c) { [System.IO.File]::WriteAllText($_.FullName, $n, (New-Object System.Text.UTF8Encoding($false))); Write-Host "patched $($_.FullName)" }
          }

      - name: Configure
        shell: pwsh
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=cl
          -DCMAKE_CXX_COMPILER=cl
          -DYUZU_TESTS=OFF
          -DYUZU_CMD=OFF
          -DYUZU_ROOM=OFF
          -DYUZU_ROOM_STANDALONE=OFF
          -DENABLE_UPDATE_CHECKER=OFF
          -DUSE_DISCORD_PRESENCE=OFF
          -DENABLE_QT_TRANSLATION=ON

      - name: Build
        shell: pwsh
        run: cmake --build build --parallel -- -k 0

      - name: Collect executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-out | Out-Null
          Get-ChildItem -Recurse build -Include eglantine.exe,eden.exe,yuzu.exe | ForEach-Object { Copy-Item $_.FullName dist-out/ ; Write-Host $_.FullName }
          Copy-Item tuned/nx2_switches.txt dist-out/ -ErrorAction SilentlyContinue
          Copy-Item tuned/launch-tuned.cmd dist-out/ -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        with:
          name: eglantine-windows-fr
          path: dist-out/
